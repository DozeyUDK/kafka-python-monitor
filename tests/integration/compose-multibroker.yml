# Test-only three-node KRaft cluster. No security; NEVER deploy to production.
# Bind all exported ports to loopback. Every broker is both a broker and a
# controller, so one-node loss must preserve the two-voter quorum.
services:
  broker1:
    image: apache/kafka:3.9.1
    hostname: broker1
    ports:
      - "127.0.0.1:29191:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker1:19092,PLAINTEXT_HOST://localhost:29191"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1:29093,2@broker2:29093,3@broker3:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx448m"
    mem_limit: 1024m
    pids_limit: 200
  broker2:
    image: apache/kafka:3.9.1
    hostname: broker2
    ports:
      - "127.0.0.1:29192:9092"
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker2:19092,PLAINTEXT_HOST://localhost:29192"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1:29093,2@broker2:29093,3@broker3:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx448m"
    mem_limit: 1024m
    pids_limit: 200
  broker3:
    image: apache/kafka:3.9.1
    hostname: broker3
    ports:
      - "127.0.0.1:29193:9092"
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker3:19092,PLAINTEXT_HOST://localhost:29193"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1:29093,2@broker2:29093,3@broker3:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx448m"
    mem_limit: 1024m
    pids_limit: 200
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    ports:
      - "127.0.0.1:19201:9200"
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1536m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
