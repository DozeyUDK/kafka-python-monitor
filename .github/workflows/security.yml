name: Security Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-file-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject tracked secrets, sensitive file types and local workspace paths
        run: python scripts/check_repo_safety.py
      - name: Audit Python dependencies against known vulnerabilities
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
