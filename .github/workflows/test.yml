name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock pytest
      - name: Compile modules
        run: python -m compileall -q program.py src
      - name: Run unit tests with real client packages
        run: python -m pytest -q
      - name: Build container
        run: docker build --pull -t kafka-python-monitor:ci .
