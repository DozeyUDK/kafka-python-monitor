# Example deployment of the monitor only. Kafka and Elasticsearch are external.
# Copy env.example to .env privately, then set real endpoints via mounted secrets.
# Never use tests/integration/compose.yml for production.
services:
  kafka-monitor:
    image: kafka-python-monitor:local
    build: ..
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 45s
    env_file:
      - ../.env
    environment:
      HEALTH_CHECK_PORT: "8080"
      HEALTH_SERVER_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8080:8080"
